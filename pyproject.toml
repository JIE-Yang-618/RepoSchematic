[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-schematic"
version = "0.1.0"
description = "Local-first repository maps for developers and AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jie Yang"}]
keywords = ["repository", "static-analysis", "codebase", "ai-agents", "developer-tools", "architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
treesitter = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]
dev = ["pytest>=8,<10"]

[project.scripts]
reposchematic = "reposchematic.cli:main"

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
